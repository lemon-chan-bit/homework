<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日曆記事本</title>
  <style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #222;
  --muted: #6b7280;
  --primary: #2563eb;
  --danger: #dc2626;
  --border: #d1d5db;
  --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
  color: var(--text);
}

.app-shell {
  width: min(1100px, calc(100% - 32px));
  margin: 32px auto;
  display: grid;
  gap: 24px;
}

header {
  text-align: center;
}

h1 {
  margin: 0;
  font-size: clamp(2rem, 4vw, 3rem);
}

p {
  margin: 8px auto 0;
  color: var(--muted);
  max-width: 700px;
}

.calendar-card,
.note-card {
  background: var(--card);
  border: 1px solid #e5e7eb;
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 24px;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
}

.calendar-header button {
  border: 1px solid var(--border);
  background: white;
  color: var(--text);
  border-radius: 999px;
  width: 44px;
  height: 44px;
  font-size: 1.4rem;
  cursor: pointer;
}

.month-year {
  font-size: 1.3rem;
  font-weight: 700;
}

.today-label {
  color: var(--muted);
  font-size: 0.95rem;
}

.weekdays,
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}

.weekdays {
  text-align: center;
  color: var(--muted);
  font-weight: 700;
  margin-bottom: 8px;
}

.calendar-grid {
  gap: 10px;
}

.day-cell {
  min-height: 90px;
  padding: 12px;
  border-radius: 18px;
  border: 1px solid transparent;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
}

.day-cell:hover {
  transform: translateY(-1px);
  background: #eff6ff;
}

.day-cell.inactive {
  opacity: 0.35;
  cursor: default;
  background: transparent;
}

.day-cell.selected {
  border-color: var(--primary);
  background: rgba(37, 99, 235, 0.12);
}

.day-number {
  font-weight: 700;
  margin-bottom: 10px;
}

.note-dot {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  background: var(--primary);
  margin-top: auto;
  justify-self: start;
}

.note-card h2 {
  margin-top: 0;
}

.note-info {
  color: var(--muted);
  margin-bottom: 14px;
}

textarea {
  width: 100%;
  min-height: 220px;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  resize: vertical;
  font-size: 1rem;
  line-height: 1.6;
  font-family: inherit;
}

.note-actions {
  display: flex;
  gap: 12px;
  margin-top: 14px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: 600;
}

#saveNote {
  background: var(--primary);
  color: white;
}

.danger {
  background: #fde2e2;
  color: var(--danger);
}

@media (max-width: 720px) {
  .app-shell {
    margin: 16px auto;
  }

  .calendar-card,
  .note-card {
    padding: 18px;
  }

  .calendar-grid {
    gap: 8px;
  }
}
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>日曆記事本</h1>
      <p>點選日期，為該日新增或編輯記事。</p>
    </header>

    <section class="calendar-card">
      <div class="calendar-header">
        <button id="prevMonth" aria-label="上一個月">‹</button>
        <div>
          <div id="monthYear" class="month-year"></div>
          <div class="today-label" id="todayLabel"></div>
        </div>
        <button id="nextMonth" aria-label="下一個月">›</button>
      </div>

      <div class="weekdays">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section class="note-card">
      <h2>記事內容</h2>
      <div class="note-info">
        <span id="selectedDateLabel">尚未選取日期</span>
      </div>
      <textarea id="noteText" placeholder="在此輸入記事內容..."></textarea>
      <div class="note-actions">
        <button id="saveNote">儲存記事</button>
        <button id="deleteNote" class="danger">刪除記事</button>
      </div>
    </section>
  </div>

  <script>
const monthYear = document.getElementById('monthYear');
const todayLabel = document.getElementById('todayLabel');
const calendarGrid = document.getElementById('calendarGrid');
const selectedDateLabel = document.getElementById('selectedDateLabel');
const noteText = document.getElementById('noteText');
const saveNote = document.getElementById('saveNote');
const deleteNote = document.getElementById('deleteNote');
const prevMonth = document.getElementById('prevMonth');
const nextMonth = document.getElementById('nextMonth');

let selectedDate = null;
const today = new Date();
let currentYear = today.getFullYear();
let currentMonth = today.getMonth();

const storageKey = 'calendarNoteToolData';
const data = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(storageKey);
    return raw ? JSON.parse(raw) : {};
  } catch (error) {
    return {};
  }
}

function saveData() {
  localStorage.setItem(storageKey, JSON.stringify(data));
}

function formatDateKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function formatDisplayDate(date) {
  return `${date.getFullYear()} 年 ${date.getMonth() + 1} 月 ${date.getDate()} 日`;
}

function renderCalendar() {
  calendarGrid.innerHTML = '';
  const firstDay = new Date(currentYear, currentMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

  monthYear.textContent = `${currentYear} 年 ${currentMonth + 1} 月`;
  todayLabel.textContent = `今天：${formatDisplayDate(today)}`;

  for (let i = 0; i < startWeekday; i += 1) {
    const emptyCell = document.createElement('div');
    emptyCell.className = 'day-cell inactive';
    calendarGrid.appendChild(emptyCell);
  }

  for (let day = 1; day <= daysInMonth; day += 1) {
    const date = new Date(currentYear, currentMonth, day);
    const key = formatDateKey(date);
    const noteExists = Boolean(data[key]);

    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'day-cell';

    if (selectedDate && selectedDate.getTime() === date.getTime()) {
      cell.classList.add('selected');
    }

    const dayNumber = document.createElement('div');
    dayNumber.className = 'day-number';
    dayNumber.textContent = day;

    cell.appendChild(dayNumber);

    if (noteExists) {
      const dot = document.createElement('div');
      dot.className = 'note-dot';
      cell.appendChild(dot);
    }

    cell.addEventListener('click', () => {
      selectDate(date);
    });

    calendarGrid.appendChild(cell);
  }
}

function selectDate(date) {
  selectedDate = date;
  selectedDateLabel.textContent = formatDisplayDate(date);
  const key = formatDateKey(date);
  noteText.value = data[key] || '';
  renderCalendar();
}

function handleSave() {
  if (!selectedDate) {
    alert('請先選取日期。');
    return;
  }

  const key = formatDateKey(selectedDate);
  const content = noteText.value.trim();

  if (content.length > 0) {
    data[key] = content;
  } else {
    delete data[key];
  }

  saveData();
  renderCalendar();
  alert('記事已儲存。');
}

function handleDelete() {
  if (!selectedDate) {
    alert('請先選取日期。');
    return;
  }

  const key = formatDateKey(selectedDate);
  if (data[key]) {
    delete data[key];
    saveData();
    noteText.value = '';
    renderCalendar();
    alert('記事已刪除。');
  } else {
    alert('該日期沒有記事可刪除。');
  }
}

prevMonth.addEventListener('click', () => {
  currentMonth -= 1;
  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear -= 1;
  }
  renderCalendar();
});

nextMonth.addEventListener('click', () => {
  currentMonth += 1;
  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear += 1;
  }
  renderCalendar();
});

saveNote.addEventListener('click', handleSave);
deleteNote.addEventListener('click', handleDelete);

renderCalendar();
  </script>
</body>
</html>
